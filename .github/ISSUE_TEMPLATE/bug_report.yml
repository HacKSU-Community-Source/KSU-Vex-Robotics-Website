name: Bug report
description: Something on the site is broken or displays incorrectly.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and where on the site it appears.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Firefox 140 on Windows 11, Safari on iPhone 16
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop images here if they help explain the problem.
  - type: textarea
    id: attribution
    attributes:
      label: Attribution
      description: If an AI agent wrote this issue, replace this with the provider, model, and harness used.
      value: Not AI-generated
    validations:
      required: true
